name: Deploy Agent Visualization
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R visualization/. _site/
          cp -R agents _site/agents
          cp -R demo _site/demo
          # The visualization files are published at the site root,
          # so convert their repository-relative asset paths to site-relative paths.
          sed -i 's#../agents/#agents/#g; s#../demo/#demo/#g' _site/*.html
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
