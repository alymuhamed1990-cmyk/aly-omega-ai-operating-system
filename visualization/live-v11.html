<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ω Aly Omega V11 — NON BLOCKING RUNTIME</title><style>body{margin:0;background:#02060b;color:#edf7ff;font:14px system-ui}.top{padding:14px 18px;background:#07101a;border-bottom:1px solid #26394e}.app{display:grid;grid-template-columns:230px 1fr 300px;min-height:calc(100vh - 60px)}aside{padding:14px;background:#07101a}.left{border-right:1px solid #203249}.right{border-left:1px solid #203249}.room{position:relative;min-height:760px;overflow:hidden;background:radial-gradient(circle,#173b5b,#02060b 68%)}canvas{position:absolute;width:100%;height:100%}.hud{position:absolute;z-index:5;top:15px;left:3%;right:3%;display:flex;gap:8px}.hud input{flex:1;padding:12px;background:#091827;color:#fff;border:1px solid #34506b;border-radius:8px}.btn{padding:12px 18px;border:0;border-radius:8px;background:#45f0d0;font-weight:900;cursor:pointer}.status{position:absolute;z-index:5;top:65px;width:100%;text-align:center;font-weight:900}.core{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:130px;height:130px;border:2px solid #45f0d0;border-radius:50%;display:grid;place-items:center;text-align:center;background:#092039}.h{font-size:10px;color:#8295a9;letter-spacing:.15em;margin:10px 0}.row{padding:9px 2px;border-bottom:1px solid #142438}.feed div{font-size:11px;padding:7px 0;border-bottom:1px solid #142438}.layer{padding:7px;margin:4px 0;border:1px solid #1d2e42;border-radius:6px;font-size:10px}.active{border-color:#45f0d0;background:#09241f}.done{border-color:#435a70}.results{position:absolute;z-index:10;left:3%;right:3%;top:105px;bottom:25px;overflow:auto;padding:14px;background:#040b13f5;border:1px solid #36546e;border-radius:10px;display:none;white-space:pre-wrap;line-height:1.5}.results.show{display:block}@media(max-width:900px){.app{display:block}.left,.right{display:none}.room{min-height:calc(100vh - 60px)}}@media(max-width:600px){.hud{flex-direction:column}.room{min-height:760px}.status{top:120px}}</style></head><body><div class="top"><b>Ω Aly Omega V11 — NON-BLOCKING RUNTIME</b><div style="font-size:11px;color:#45f0d0">● RUN READY • REAL INTERNET</div></div><div class="app"><aside class="left"><div class="h">RUNTIME</div><div class="row">Internet <b>READY</b></div><div class="row">RUN <b>READY</b></div><div class="row">Sources <b id="src">0</b></div><div class="row">AI <b id="ai">OPTIONAL</b></div><div class="h">11 LAYERS</div><div id="layers"></div><div class="h">EVENT STREAM</div><div id="feed" class="feed"></div></aside><main class="room"><canvas id="c"></canvas><div class="hud"><input id="q" value="Find B2B DMC suppliers in Sri Lanka suitable for a Saudi travel agency"><button id="go" class="btn">▶ RUN OMEGA</button></div><div id="status" class="status">READY — CLICK RUN OMEGA</div><div id="results" class="results"></div><div class="core"><b>Ω OMEGA<br><small>ORCHESTRATOR</small><br><small>11 GATES</small></b></div></main><aside class="right"><div class="h">EXECUTION</div><h2 id="agent">OMEGA</h2><div class="h">FLOW</div><div id="path"></div><div class="h">MODE</div><div>REAL INTERNET</div><div>AI GATES ENABLE WHEN AVAILABLE</div></aside></div><script>const API='https://aly-omega-runtime-beta.vercel.app/api/run';const S=['INTAKE','CLASSIFY','AI RESEARCH PLAN','WEB EVIDENCE','AI EVALUATION','SPECIALIST FAN-OUT','COMMERCIAL FIT','OPS FIT','VALIDATION','RED TEAM','FINAL GATE'];const $=x=>document.getElementById(x);let stage=-1,running=false;function log(t){let e=document.createElement('div');e.textContent=t;$('feed').prepend(e)}function ui(){$('layers').innerHTML=S.map((s,i)=>`<div id="l${i}" class="layer">${i+1}. ${s}</div>`).join('');$('path').innerHTML=S.map((s,i)=>`<div id="p${i}" class="layer">${i+1} • ${s}</div>`).join('')}function setStage(i){stage=i;S.forEach((_,j)=>{let a=$('l'+j),b=$('p'+j);a.className='layer';b.className='layer';if(j<i){a.classList.add('done');b.classList.add('done')}if(j===i){a.classList.add('active');b.classList.add('active')}});$('agent').textContent=S[i];$('status').textContent='LAYER '+(i+1)+'/11 • '+S[i];log(S[i]+' → active')}function draw(t){let c=$('c'),x=c.getContext('2d'),d=devicePixelRatio||1,r=c.getBoundingClientRect();if(c.width!==r.width*d){c.width=r.width*d;c.height=r.height*d}let W=c.width,H=c.height,m=Math.min(W,H),cx=W/2,cy=H*.5;x.clearRect(0,0,W,H);for(let i=0;i<S.length;i++){let rr=m*(.39-i*.026);x.beginPath();x.arc(cx,cy,rr,0,Math.PI*2);x.strokeStyle=i===stage?'#45f0d078':'#4e647b18';x.stroke();if(i===stage){for(let k=0;k<7;k++){let a=t*.001+i+k*Math.PI*2/7;x.beginPath();x.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.7,5*d,0,7);x.fillStyle='#45f0d0';x.fill()}}}requestAnimationFrame(draw)}function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}async function run(){if(running)return;let task=$('q').value.trim();if(!task)return;running=true;$('go').disabled=true;$('results').classList.remove('show');$('src').textContent='0';try{setStage(0);await new Promise(r=>setTimeout(r,120));setStage(1);await new Promise(r=>setTimeout(r,120));setStage(2);log('Research intent prepared');setStage(3);log('REAL INTERNET REQUEST SENT');let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:task+'\nPrioritize first-party supplier/DMC sources, B2B cooperation, destination coverage, services and commercial fit.'}),signal:ctl.signal});clearTimeout(timer);if(!r.ok)throw Error('Internet HTTP '+r.status);let d=await r.json(),all=d.results||[];$('src').textContent=all.length;log('Internet returned '+all.length+' candidates');for(let i=4;i<S.length;i++){setStage(i);await new Promise(r=>setTimeout(r,180))}let text=all.length?all.slice(0,10).map((z,i)=>(i+1)+'. '+(z.title||'Untitled')+'\n'+(z.url||'')+'\n'+(z.description||'')+'\nFit: '+(z.fit_score??'n/a')).join('\n\n'):'NO VERIFIED RESULT — Internet returned zero candidates.';$('results').innerHTML='<b>OMEGA RESULT • REAL INTERNET EVIDENCE</b>\n\n'+esc(text)+'\n\nSOURCES: '+all.length;$('results').classList.add('show');log('FINAL GATE → RESULT RELEASED')}catch(e){$('results').innerHTML='<b>OMEGA EXECUTION ERROR</b>\n\n'+esc(e.name==='AbortError'?'Internet request timed out after 15 seconds.':e.message);$('results').classList.add('show');log('RUN ERROR → '+e.message)}finally{running=false;$('go').disabled=false;$('status').textContent='READY — CLICK RUN OMEGA'}}ui();draw(0);$('go').onclick=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};log('V11 loaded — no local model is loaded on page startup');</script></body></html>
